name: mobile_concert
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  # FLUTTER
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

    # HELPER
  equatable: ^2.0.7
  logger: ^2.6.1
  device_info_plus: ^12.1.0
  package_info_plus: ^9.0.0
  shared_preferences: ^2.5.3
  flutter_dotenv: ^6.0.0
  url_launcher: ^6.3.2
  dio: ^5.9.0
  connectivity_plus: ^7.0.0
  version: ^3.0.2
  intl: ^0.20.2
  permission_handler: ^11.0.0
  share_plus: ^12.0.0
  validators: ^3.0.0
  http_parser: ^4.1.2

  # WIDGET
  photo_view: ^0.15.0
  modal_bottom_sheet: ^3.0.0
  bot_toast: ^4.1.3
  flutter_svg: ^2.1.0
  shimmer: ^3.0.0
  auto_size_text: ^3.0.0
  flutter_slidable: ^4.0.0
  cached_network_image: ^3.4.1
  lottie: ^3.3.1
  scrollable_positioned_list: ^0.3.8
  flashy_tab_bar2: ^0.0.10
  cached_video_player_plus: ^4.0.4
  video_player: ^2.10.0
  chewie:
    ^1.13.0

    # STATE MANAGEMENT
  flutter_bloc: ^9.1.1
  go_router: ^16.2.1
  get_it:
    ^8.0.3

    # FIREBASE
  firebase_core: ^4.1.0
  firebase_analytics: ^12.0.1
  firebase_app_check: ^0.4.0
  firebase_crashlytics: ^5.0.1
  firebase_remote_config: ^6.0.1
  firebase_messaging: ^16.0.1
  cloud_firestore: ^6.0.1
  cupertino_icons: ^1.0.8
  tencent_live_uikit: ^3.4.0
  crypto: ^3.0.6
  live_stream_core: ^3.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  flutter_gen_runner: ^5.10.0

flutter_gen:
  output: lib/generated/assets
  assets:
    exclude:
      - .env.production
  integrations:
    flutter_svg: true
    lottie: true

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    # - assets/images/
    - assets/lotties/
    - assets/svgs/
    - assets/images/
    - .env.production
